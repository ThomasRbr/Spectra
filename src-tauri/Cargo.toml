[package]
name = "spectra"
version = "1.0.0"
description = "SPECTRA — Crypto Tracing Lab"
authors = ["Thomas Robert"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "spectra_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.1.0", features = [] }

[profile.release]
# Exécutable plus petit
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
